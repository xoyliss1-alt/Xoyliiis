databases:
  - name: woodoogifi-db
    databaseName: woodoogifi
    user: woodoogifi
    plan: free

services:
  - type: web
    name: woodoogifi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m py_compile main.py
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: woodoogifi-db
          property: connectionString
      - key: REFERRAL_REWARD
        value: "3"
      - key: MIN_REFERRALS
        value: "5"
