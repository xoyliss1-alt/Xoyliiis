services:
  - type: worker
    name: woodoogifi-bot
    runtime: python
    buildCommand: python -m py_compile main.py && pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: woodoogifi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        value: xoyli
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /var/data/woodoogifi.sqlite3
